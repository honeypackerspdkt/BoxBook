name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # BoxBook links the shared packages from ../rajesh-hub, so check both out side by side.
      - uses: actions/checkout@v5
        with:
          path: BoxBook

      - uses: actions/checkout@v5
        with:
          repository: yuvarajeshsp-cloud/rajesh-hub
          path: rajesh-hub

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install rajesh-hub
        working-directory: rajesh-hub
        run: npm install --no-audit --no-fund

      - name: Build BoxBook
        working-directory: BoxBook
        env:
          # Public OAuth client id for Google Drive backup (repo Settings → Variables → Actions). Optional.
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: BoxBook/dist

      - id: deployment
        uses: actions/deploy-pages@v4
